name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2

      - name: Install manager dependencies
        run: cd skills/cmux-team/manager && bun install --frozen-lockfile

      - name: Publish to npm (OIDC Trusted Publishing)
        run: |
          # setup-node が書き込む .npmrc の TOKEN プレースホルダーを削除し
          # npm に OIDC 認証を使わせる
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG" 2>/dev/null || true
          npm publish --provenance --access public

      - name: Extract changelog and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES"
